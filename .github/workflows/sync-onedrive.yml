name: Sync Stock from OneDrive

on:
  schedule:
    # Every 2 minutes. GitHub Actions doesn't guarantee exact timing (actual
    # runs can lag a bit under load), but this is the shortest practical
    # interval — same caveat the reference architecture itself notes for
    # its own 5-minute schedule.
    - cron: "*/2 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" to force an immediate check

permissions:
  contents: write

concurrency:
  group: sync-onedrive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest Excel from OneDrive
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
        run: python scripts/sync_onedrive.py

      - name: Build data.json
        run: python scripts/build_static.py

      - name: Commit changes if the sheet actually changed
        run: |
          git config user.name "stock-sync-bot"
          git config user.email "stock-sync-bot@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No change in stock data — nothing to commit."
          else
            git add data.json
            git commit -m "chore: sync stock data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
