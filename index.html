<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOH Stock Checker - Digimap Tunjungan Plaza 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        darkbg: '#0f172a', cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(148, 163, 184, 0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
        .glass-card { backdrop-filter: blur(12px); }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col custom-scrollbar">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3.5 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg text-white font-bold text-xl shrink-0">
                    SOH
                </div>
                <div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Stock On Hand Checker</h1>
                        <span class="text-[10px] font-bold text-amber-600 dark:text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-full uppercase">beta</span>
                        <div id="syncStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-emerald-500/10 text-emerald-600 border border-emerald-500/20">
                            <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span id="syncStatusText">Synced</span>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">M121 - DIGIMAP TUNJUNGAN PLAZA 3 SURABAYA</p>
                </div>
            </div>

            <div class="flex items-center gap-3 justify-between md:justify-end">
                <div class="hidden sm:flex flex-col text-right px-3 py-1.5 rounded-lg bg-slate-200/80 dark:bg-slate-800/80 border border-slate-300/60 dark:border-slate-700/60 text-[11px] text-slate-500 dark:text-slate-400">
                    <div>Tanggal RAW: <span id="rawDateText" class="font-semibold text-slate-800 dark:text-slate-200">30-08-2026</span></div>
                    <div>Jam RAW: <span id="rawTimeText" class="font-semibold text-emerald-600 dark:text-emerald-400">09:32:25 WIB</span></div>
                </div>
                <button onclick="openSettingsModal()" class="px-3.5 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-medium text-xs flex items-center gap-2">
                    <span>Settings</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">

        <!-- Metrics Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-5 gap-3.5">
            <div class="glass-card bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                <span class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Total Unit SOH</span>
                <div class="mt-2 flex items-baseline gap-2">
                    <span id="metricTotalUnits" class="text-2xl font-extrabold text-slate-900 dark:text-white">635</span>
                    <span class="text-xs text-slate-500">unit</span>
                </div>
            </div>
            <div onclick="selectCategory('iPhone')" class="glass-card bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 cursor-pointer border-l-4 border-l-sky-500">
                <span class="text-xs font-semibold uppercase text-slate-500">iPhone</span>
                <div class="mt-2 flex items-baseline gap-2">
                    <span id="metricIPhone" class="text-2xl font-extrabold text-sky-600 dark:text-sky-400">444</span>
                    <span class="text-xs text-slate-500">unit</span>

            <div onclick="selectCategory('iPad')" class="glass-card bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 cursor-pointer border-l-4 border-l-indigo-500">

                    <span class="text-xs text-slate-500">unit</span>
                </div>
            </div>
            <div onclick="selectCategory('Mac')" class="glass-card bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 cursor-pointer border-l-4 border-l-purple-500">
                <span class="text-xs font-semibold uppercase text-slate-500">Macbook / Mac</span>
                <div class="mt-2 flex items-baseline gap-2">
                    <span id="metricMac" class="text-2xl font-extrabold text-purple-600 dark:text-purple-400">84</span>

                <div class="mt-2 flex items-center justify-between">
                    <div>Watch: <strong id="metricWatch" class="text-emerald-600 dark:text-emerald-400">43</strong></div>
                    <div>AirPods: <strong id="metricAirPods" class="text-emerald-600 dark:text-emerald-400">4</strong></div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-4">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar" id="categoryTabContainer"></div>

            <div class="glass-card bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 flex flex-col md:flex-row items-center justify-between gap-3">
                <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="Cari Kode Artikel atau Nama Produk..." class="w-full pl-4 pr-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs focus:outline-none focus:border-sky-500">
                
                <div class="flex items-center gap-2">
                    <select id="stockFilterSelect" onchange="applyFilters()" class="py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs">
                        <option value="all">Semua Level Stock</option>
                        <option value="high">Stock Melimpah (>10)</option>
                        <option value="medium">Stock Medium (5-10)</option>
                        <option value="low">Stock Menipis (1-4)</option>
                        <option value="zero">Habis (0)</option>
                    </select>

                    <select id="sortSelect" onchange="applyFilters()" class="py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs">
                        <option value="qty-desc">Qty: Tertinggi → Terendah</option>
                        <option value="qty-asc">Qty: Terendah → Tertinggi</option>
                        <option value="desc-asc">Nama: A → Z</option>
                    </select>

                    <div class="flex items-center bg-slate-100 dark:bg-slate-900 rounded-xl p-1 border border-slate-300 dark:border-slate-700">
                        <button onclick="setViewMode('table')" class="p-1.5 rounded-lg text-xs font-medium">Tabel</button>
                        <button onclick="setViewMode('card')" class="p-1.5 rounded-lg text-xs font-medium">Kartu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div id="tableViewContainer" class="glass-card bg-white/90 dark:bg-slate-800/90 rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-xl">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 uppercase border-b border-slate-200 dark:border-slate-700">
                            <th class="py-3.5 px-4 text-center">#</th>
                            <th class="py-3.5 px-4">Kategori</th>
                            <th class="py-3.5 px-4">SAP Article</th>
                            <th class="py-3.5 px-4">Deskripsi Produk</th>
                            <th class="py-3.5 px-4 text-center">Status</th>
                            <th class="py-3.5 px-4 text-right">Jumlah SOH</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Card View -->
        <div id="cardViewContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
    </main>

            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            stockFilter = document.getElementById('stockFilterSelect').value;
            sortOption = document.getElementById('sortSelect').value;

            let items = [];
            Object.keys(currentSOH).forEach(cat => {

            });

            if(searchQuery) items = items.filter(i => i.description.toLowerCase().includes(searchQuery) || i.article.toLowerCase().includes(searchQuery));

            else if(stockFilter === 'medium') items = items.filter(i => i.qty >= 5 && i.qty <= 10);

            else if(stockFilter === 'zero') items = items.filter(i => i.qty === 0);

            if(sortOption === 'qty-desc') items.sort((a, b) => b.qty - a.qty);

            renderCards(items);
