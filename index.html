<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOH Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: { dark: '#1d1d1f', light: '#f5f5f7' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions */
        body { transition: background-color 0.3s, color 0.3s; }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-apple-light text-gray-900 dark:bg-apple-dark dark:text-gray-100 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Stock On Hand (SOH)</h1>
                <p id="report-date" class="text-sm text-gray-500 dark:text-gray-400 mt-1 flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4"></i> Loading date info...
                </p>
            </div>
            <div class="flex items-center gap-3">
                <button id="sync-btn" onclick="fetchData()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="sync-icon"></i>
                    Manual Sync
                </button>
                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                    <i data-lucide="sun" id="theme-icon" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div id="dashboard-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Data will be injected here via JS -->
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Theme Toggle Logic (Default to device preference)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        function updateThemeIcon() {
            if (html.classList.contains('dark')) {
                themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        }

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }
        updateThemeIcon();

        themeToggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcon();
        });

        // Fetch Data Logic
        async function fetchData() {
            const syncIcon = document.getElementById('sync-icon');
            const container = document.getElementById('dashboard-container');
            const dateEl = document.getElementById('report-date');
            
            // Spin animation
            syncIcon.classList.add('animate-spin');

            try {
                // Fetch with cache busting parameter for manual syncs
                const res = await fetch(`data.json?t=${new Date().getTime()}`);
                const data = await res.json();
                
                // Update Date
                dateEl.innerHTML = `<i data-lucide="clock" class="w-4 h-4"></i> ${data.report_info}`;
                lucide.createIcons();
                
                // Render Categories
                container.innerHTML = '';
                for (const [category, items] of Object.entries(data.categories)) {
                    // Calculate Total
                    const totalQty = items.reduce((sum, item) => sum + parseInt(item.qty || 0), 0);
                    
                    const card = document.createElement('div');
                    card.className = "card bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col";
                    
                    let tableHTML = `
                        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 flex justify-between items-center">
                            <h2 class="text-lg font-semibold">${category}</h2>
                            <span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-xs font-bold px-2.5 py-1 rounded-full">Total: ${totalQty}</span>
                        </div>
                        <div class="overflow-x-auto flex-1">
                            <table class="w-full text-sm text-left">
                                <thead class="text-xs text-gray-500 dark:text-gray-400 uppercase bg-gray-50 dark:bg-gray-900/50 sticky top-0">
                                    <tr>
                                        <th scope="col" class="px-6 py-3">Article</th>
                                        <th scope="col" class="px-6 py-3">Description</th>
                                        <th scope="col" class="px-6 py-3 text-right">Qty</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    items.forEach(item => {
                        tableHTML += `
                            <tr class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                                <td class="px-6 py-3 font-medium whitespace-nowrap text-gray-900 dark:text-gray-300">${item.article}</td>
                                <td class="px-6 py-3 text-gray-600 dark:text-gray-400">${item.description}</td>
                                <td class="px-6 py-3 text-right font-semibold">${item.qty}</td>
                            </tr>
                        `;
                    });

                    tableHTML += `</tbody></table></div>`;
                    card.innerHTML = tableHTML;
                    container.appendChild(card);
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                dateEl.innerHTML = `<span class="text-red-500">Failed to sync data.</span>`;
            } finally {
                setTimeout(() => syncIcon.classList.remove('animate-spin'), 500);
            }
        }

        // Initial Load
        fetchData();
    </script>
</body>
</html>
